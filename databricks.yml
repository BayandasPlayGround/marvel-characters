bundle:
  name: marvel-characters # Name of the bundle project

include: # Modularising our configuration by including seperate .yml files that define the job configuration
  - resources/* # monitoring and deployment workflow and tasks

artifacts: # We tell the bundle how to build the code that will run in the job
  default:
    type: whl
    build: uv build
    path: . # path where the build process will start
# This artifact will be made available to the job while it is deployed

variables: # Global variables
  git_sha:
    description: git_sha
    default: abcd
  branch:
    description: branch
    default: main
  schedule_pause_status:
    description: schedule pause status
    default: PAUSED


targets: # Our targets
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-44dbcddd-a15a.cloud.databricks.com/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
    variables:
      schedule_pause_status: PAUSED

  acc:
    presets:
      name_prefix: 'acc_'
    workspace:
      host: https://dbc-44dbcddd-a15a.cloud.databricks.com/
      root_path: /Shared/.bundle/${bundle.target}/${bundle.name}
    variables:
      schedule_pause_status: PAUSED

  prd:
    mode: production
    workspace:
      host: https://dbc-44dbcddd-a15a.cloud.databricks.com/
      root_path: /Shared/.bundle/${bundle.target}/${bundle.name}
    variables:
      schedule_pause_status: PAUSED # normally UNPAUSED
